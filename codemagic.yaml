workflows:
  ios-release:
    name: Biber Fieber iOS
    max_build_duration: 60

    environment:
      node: latest
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.silversurfer.biberfieber

    scripts:
      - name: Install pnpm
        script: |
          npm install -g pnpm --force
          pnpm install --ignore-scripts=false

      - name: Build Web
        script: |
          pnpm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration