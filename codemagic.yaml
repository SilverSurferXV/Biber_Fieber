workflows:
  ios-release:
    name: Biber Fieber iOS
    max_build_duration: 60

    environment:
      node: latest
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          cd Biber_Fieber
          corepack enable
          yarn --version
          yarn install

      - name: Sync Capacitor iOS
        script: |
          cd Biber_Fieber
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd Biber_Fieber/ios/App
          pod install --repo-update

      - name: Build iOS project
        script: |
          cd Biber_Fieber/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - Biber_Fieber/ios/App/build/**/*.app
      - ~/Library/Developer/Xcode/DerivedData/**/Build/**/*.app